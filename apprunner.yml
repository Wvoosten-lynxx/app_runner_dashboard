# apprunner.yml
version: 1.0

# Runtime configuration for the Python application
runtime: python3

# Command to install dependencies and run the Streamlit application
build:
  commands:
    # Install dependencies listed in a requirements.txt file
    - pip install -r requirements.txt

run:
  command: streamlit run app.py --server.port 8080 --server.address 0.0.0.0