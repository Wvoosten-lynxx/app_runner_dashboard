version: 1.0

runtime: python3 

build:
  commands:
    pre-build:
      # Update pip to the latest version
      - python -m pip install --upgrade pip
    build:
      # Install dependencies from requirements.txt
      - pip install -r requirements.txt
    # Uncomment the post-build section if you have tests to run
    #post-build:
      # Run any tests (optional)
      #- python -m unittest discover

  # Define environment variables for the build process (if needed)
  env:
    - name: STREAMLIT_ENV
      value: "production"

run:
  # Start Streamlit on port 8080
  command: streamlit run app.py --server.port 8080 --server.address 0.0.0.0
  
  # Network settings
  network: 
    port: 8080
    env: STREAMLIT_PORT
  
  # Environment variables to enhance WebSocket and Streamlit compatibility
  env:
    - name: STREAMLIT_ENV
      value: "production"
    - name: STREAMLIT_SERVER_ENABLE_CORS
      value: "false"  # Disable CORS for compatibility
    - name: STREAMLIT_SERVER_ENABLE_WEBSOCKET_COMPRESSION
      value: "false"  # Disable WebSocket compression
    - name: STREAMLIT_SERVER_FILE_WATCHER_TYPE
      value: "none"   # Disable file watcher to reduce load
    - name: STREAMLIT_SERVER_ENABLE_XSRF_PROTECTION
      value: "false"  # Disable XSRF protection for proxy compatibility
    - name: STREAMLIT_SERVER_BASE_URL_PATH
      value: "/"      # Explicitly set base URL path (adjust as needed)
    - name: STREAMLIT_SERVER_PORT
      value: "8080"   # Match the exposed port for consistency
    - name: STREAMLIT_SERVER_ADDRESS
      value: "0.0.0.0"  # Set server to listen on all interfaces

  # Optional secrets section if using AWS Secrets Manager
  secrets:
    # Uncomment and define if secrets are required
    # - name: my-secret
    #   value-from: "arn:aws:secretsmanager:region:account-id:secret:your-secret-name"